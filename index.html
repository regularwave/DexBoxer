<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DexBoxer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo-group">
            <div class="logo-icon">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>
            <div class="logo-text">
                <h1>DexBoxer</h1>
                <p>Box Visualizer</p>
            </div>
        </div>

        <div class="controls">
            <button id="btn-export" class="btn-icon" title="Export Collection Data"></button>
            <button id="btn-import" class="btn-icon" title="Import Collection Data"></button>
            <input type="file" id="file-import" accept=".json" style="display: none;">
            <button id="theme-toggle" class="btn-icon" title="Toggle Light/Dark Mode"></button>

            <div class="control-group">
                <label for="game-select">Target Game</label>
                <select id="game-select">
                    <option value="NatDex" selected>National Dex (HOME)</option>
                    <option value="PLZA">Legends: Z-A (PLZA)</option>
                    <option value="SV">Scarlet/Violet (SV)</option>
                    <option value="PLA">Legends: Arceus (PLA)</option>
                    <option value="BDSP">Brilliant Diamond/Shining Pearl (BDSP)</option>
                    <option value="SwSh">Sword/Shield (SwSh)</option>
                    <option value="LGPE">Let's Go Pikachu/Eevee (LGPE)</option>
                    <option value="USUM">Ultra Sun/Ultra Moon (USUM)</option>
                    <option value="ORAS">Omega Ruby/Alpha Sapphire (ORAS)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="completeness-select">Completeness</label>
                <select id="completeness-select">
                    <option value="species" selected>Base Species Only</option>
                    <option value="forms">Include Alternate Forms</option>
                    <option value="all">Everything (Forms & Genders)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="sort-select">Sort By</label>
                <select id="sort-select">
                    <option value="game" selected>Game Dex Number</option>
                    <option value="natDex">National Dex Number</option>
                    <option value="name">Alphabetical</option>
                </select>
            </div>

            <div class="control-group">
                <label for="gap-select">Dex Gap</label>
                <select id="gap-select">
                    <option value="continuous" selected>Continuous (no gaps)</option>
                    <option value="gap">Gen/Dex Gaps</option>
                </select>
            </div>
        </div>
    </header>

    <div class="status-bar">
        <div id="status-message" class="status-message">
            <svg class="svg-icon spin" viewBox="0 0 24 24" style="color: var(--primary);">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
            Loading dataset...
        </div>
        <div id="stats-message" class="stats-message">
            0 / 0 Collected <span class="stats-badge">0%</span>
        </div>
    </div>

    <main>
        <div id="boxes-container" class="boxes-container">
            <!-- boxes go here -->
        </div>
    </main>

    <footer>
        <a href="https://github.com/regularwave/DexBoxer" target="_blank" rel="noopener noreferrer">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            Report an Issue on GitHub
        </a>
    </footer>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content" id="modal-content">
            <div class="modal-header">
                <h3>
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    Pokémon Details
                </h3>
                <button id="close-modal" class="btn-close">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-sprite" src="" alt="Sprite" class="pokemon-sprite">
                </div>
                <div class="modal-info">
                    <h2 id="modal-name">Bulbasaur</h2>
                    <div class="modal-badge">
                        Nat. Dex #<span id="modal-natdex">0001</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Target Game ID:</span>
                        <span id="modal-gameid" class="info-value">---</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Form:</span>
                        <span id="modal-form" class="info-value">Base</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Gender:</span>
                        <span id="modal-gender" class="info-value">Any</span>
                    </div>
                    <div class="info-row no-border">
                        <span class="info-label">Status:</span>
                        <span id="modal-status" class="status-collected">Collected</span>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="modal-toggle-btn" class="btn-toggle uncollected">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Toggle Collected Status
                </button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
